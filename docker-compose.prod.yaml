x-app-env: &app-env
  env_file:
    - ./.env.docker
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    NODE_ENV: production
    PG_URL: postgresql://${PG_OCR_USER}:${PG_OCR_PASSWORD}@postgres:5432/${PG_OCR_DB}
    REDIS_OCR_HOST: redis-prod
    REDIS_OCR_PORT: 6379
    AMQP_URL: ${AMQP_URL}
    S3_ENDPOINT: http://garage-prod:3900
    S3_REGION: garage
    S3_FORCE_PATH_STYLE: true
    WEB_ALLOWED_HOSTS: ${WEB_ALLOWED_HOSTS:-ocr-web-prod}
  networks:
    - ocr-network
    - redis-network
    - garage-network
    - rabbitmq-network

services:
  postgres:
    image: postgres:18-alpine
    container_name: ocr-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_OCR_DB}
      POSTGRES_USER: ${PG_OCR_USER}
      POSTGRES_PASSWORD: ${PG_OCR_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_OCR_USER} -d ${PG_OCR_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${PG_OCR_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ocr-network

  db-migrate:
    <<: *app-env
    container_name: ocr-db-migrate-prod
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    command: ["pnpm", "--filter", "@ocr/db", "migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app-env
    container_name: ocr-web-prod
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3010"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - ocr-network
      - redis-network
      - garage-network
      - rabbitmq-network
      - monitoring-shared

  split-pdf-worker:
    <<: *app-env
    container_name: ocr-split-pdf-worker-prod
    build:
      context: .
      dockerfile: ./workers/split-pdf-worker/Dockerfile
    restart: unless-stopped
    # Leaves room for the consumer drain (15s) before SIGKILL.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  transcribe-jpg-worker:
    <<: *app-env
    container_name: ocr-transcribe-jpg-worker-prod
    build:
      context: .
      dockerfile: ./workers/transcribe-jpg-worker/Dockerfile
    restart: unless-stopped
    # Leaves room for the consumer drain (15s) before SIGKILL.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  post-process-page-worker:
    <<: *app-env
    container_name: ocr-post-process-page-worker-prod
    build:
      context: .
      dockerfile: ./workers/post-process-page-worker/Dockerfile
    restart: unless-stopped
    # Leaves room for the consumer drain (15s) before SIGKILL.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  cleanup-process-worker:
    <<: *app-env
    container_name: ocr-cleanup-process-worker-prod
    build:
      context: .
      dockerfile: ./workers/cleanup-process-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
    name: ocr-pgdata-prod

networks:
  ocr-network:
    name: ocr-network-prod
    driver: bridge
  monitoring-shared:
    name: ${MONITORING_SHARED_NETWORK:-monitoring-shared}
    external: true
  redis-network:
    name: redis-network
    external: true
  garage-network:
    name: garage-network
    external: true
  rabbitmq-network:
    name: rabbitmq-network
    external: true
